<title>Osh Markazi: milliy taomlar</title>
<style>
/* Hallmark · shape: Catalogue (a ruled menu of dishes) · genre: editorial · theme: Solstice (deal 1/3, seed restaurant-menu-ordering-uzbek-d84f·d0b85462·2026-11-08·r0) · redesign: full
 * hero: Stage · nav: left rail on desktop, ruled tab strip on phone · footer: none (an app shell) · imagery: the user's own dish photographs · signature: the plov photograph square beside a Yeseva headline, every price set in the display face · solstice: long-light by day, dusk by night
 * axes: light/high-contrast-serif/warm · posture: restrained · contrast: pass · fold: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E3 S4 R4 V4 · weakest: E, the dish photos are hotlinked stock stand-ins, so the hero keeps a caption naming the dish and the owner's own photographs replace them */
/* Hallmark · dropped #scrollBar, scrollBar · the scroll-progress glow was decorative and the theme keeps still */
@import url("./tokens.css");
@import url("./base.css");

/* ---------- aliases the script's inline styles still read ---------- */
:root{
  --text-2:var(--color-muted); --text-3:var(--color-muted);
  --red:var(--color-error); --green:var(--color-success);
  --gold:var(--color-gold); --gold-2:var(--color-gold);
  --ease:var(--ease-out);
  --font-label:var(--font-outlier);
  --tab-h:64px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --color-paper:oklch(27% 0.05 40); --color-paper-2:oklch(31% 0.05 40); --color-paper-3:oklch(22% 0.04 40);
  --color-ink:oklch(95% 0.03 80); --color-ink-2:oklch(86% 0.03 80); --color-muted:oklch(74% 0.04 70);
  --color-rule:oklch(42% 0.05 50);
  --color-focus:oklch(84% 0.11 80); --color-gold:oklch(78% 0.14 80);
  --color-error:oklch(72% 0.17 27); --color-success:oklch(74% 0.14 150);
  --shadow-card:10px 10px 0 var(--color-paper-3);
}
html[data-theme="dark"] .card-emoji img,html[data-theme="dark"] .hero-photo img{filter:sepia(.22) saturate(.92) brightness(.9)}

/* ---------- base page ---------- */
body{background:var(--color-paper);color:var(--color-ink);transition:background var(--dur-long) var(--ease-out),color var(--dur-long) var(--ease-out)}
button{color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.ic{display:inline-block;vertical-align:middle;flex:0 0 auto}
.press{transition:transform var(--dur-micro) var(--ease-out)}
.press:active{transform:scale(.97)}
#app{min-height:100dvh;padding:0 0 calc(var(--tab-h) + var(--space-xl) + env(safe-area-inset-bottom))}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:var(--z-toast);background:var(--color-ink);color:var(--color-paper);
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--dur-long) var(--ease-in-out),opacity var(--dur-long) var(--ease-in-out)}
html[data-theme="dark"] #splash{background:var(--color-paper-3);color:var(--color-ink)}
#splash.done{transform:translateY(-100%);opacity:.4}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:var(--space-md)}
.chef-hat svg{width:96px;height:96px}
.chef-hat .hat-a{fill:var(--color-gold)} .chef-hat .hat-b{fill:var(--color-accent)}
.steam-s{display:none}
.splash-title{display:flex;gap:var(--space-3xs);font:var(--display-weight) var(--text-3xl)/1 var(--font-display);letter-spacing:var(--tracking-display)}
.splash-title span{display:inline-block;opacity:0;transform:translateY(12px);animation:letterIn var(--dur-long) var(--ease-out) forwards}
.splash-title span.space{width:12px}
@keyframes letterIn{to{opacity:1;transform:translateY(0)}}
.splash-sub{font:600 var(--text-sm)/1.4 var(--font-label);color:var(--color-gold-2);opacity:.9}
.splash-bar{margin-top:var(--space-md);width:144px;height:2px;background:color-mix(in oklab,currentColor 25%,transparent);overflow:hidden}
.splash-bar i{display:block;height:100%;width:100%;background:var(--color-gold);transform:scaleX(0);transform-origin:left;transition:transform 2.1s var(--ease-in-out)}
.splash-bar i.go{transform:scaleX(1)}

/* ---------- header ---------- */
#header{position:sticky;top:0;z-index:var(--z-sticky);padding:var(--space-sm) var(--space-md);
  background:var(--color-paper);border-bottom:var(--rule-bar) solid var(--color-ink)}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);max-width:1200px;margin:0 auto}
#largeTitle{font:var(--display-weight) var(--text-xl)/1 var(--font-display);letter-spacing:var(--tracking-display)}
.header-actions{display:flex;align-items:center;gap:var(--space-xs)}
.header-admin,.icon-btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);
  border:var(--rule-hair) solid var(--color-ink);border-radius:var(--radius-pill);color:var(--color-ink);background:transparent;
  font:500 var(--text-sm)/1 var(--font-body);transition:background var(--dur-short) var(--ease-out),color var(--dur-short) var(--ease-out)}
.header-admin{padding:0 var(--space-md)}
.icon-btn{width:44px;padding:0}
.header-admin:hover,.icon-btn:hover{background:var(--color-ink);color:var(--color-paper)}

/* ---------- views ---------- */
.view{display:none;padding:0 var(--space-md);max-width:1200px;margin:0 auto}
.view.active{display:block;animation:viewIn var(--dur-short) var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view-cart,#view-orders,#view-admin{padding-top:var(--space-lg)}

/* ---------- hero (Stage) ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-lg);padding:var(--space-lg) 0 var(--space-xl);align-items:center}
.hero-text{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-md)}
.hero-title{font-size:var(--text-display-s);max-width:11ch}
.hero-sub{font-size:var(--text-lead);line-height:1.45;color:var(--color-ink-2);max-width:32ch}
.hero-actions{display:flex;align-items:center;gap:var(--space-md) var(--space-lg);flex-wrap:wrap;margin-top:var(--space-xs)}
.hero-cta{display:inline-flex;align-items:center;gap:var(--space-sm);min-height:48px;padding:0 var(--space-lg);border-radius:var(--radius-pill);
  background:var(--color-accent);color:var(--color-accent-ink);font:600 var(--text-md)/1 var(--font-label);
  transition:background var(--dur-short) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.hero-cta:hover{background:var(--color-ink);color:var(--color-paper)}
.hero-cta:active{transform:scale(.97)}
.hero-note{display:flex;align-items:center;gap:var(--space-xs);color:var(--color-muted);font:600 var(--text-sm)/1.2 var(--font-label)}
.hero-illu-wrap{margin:0;display:flex;flex-direction:column;gap:var(--space-xs)}
.hero-photo{aspect-ratio:4/3;overflow:hidden;background:var(--color-paper-3);outline:var(--rule-hair) solid color-mix(in oklab,var(--color-ink) 10%,transparent);outline-offset:-1px}
.hero-photo img{width:100%;height:100%;object-fit:cover;filter:sepia(.24) saturate(.94) brightness(.97)}
.hero-image-label{display:flex;justify-content:space-between;gap:var(--space-sm);font:600 var(--text-sm)/1.3 var(--font-label);color:var(--color-muted)}
.hero-image-label strong{font-weight:600;color:var(--color-ink-2)}

/* ---------- menu heading, search, chips ---------- */
.menu-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-md);
  padding-top:var(--space-md);border-top:var(--rule-bar) solid var(--color-ink);margin:0 0 var(--space-md)}
.menu-heading h2{font-size:var(--text-section)}
.menu-count{color:var(--color-muted);font:600 var(--text-sm)/1 var(--font-label);padding-bottom:var(--space-2xs);white-space:nowrap}
.search-wrap{max-width:560px;margin:0 0 var(--space-md)}
.search{display:flex;align-items:center;gap:var(--space-sm);height:52px;padding:0 var(--space-md);background:var(--color-paper-2);
  border:var(--rule-hair) solid var(--color-ink)}
.search:focus-within{outline:2px solid var(--color-focus);outline-offset:2px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:var(--text-md);color:var(--color-ink)}
.search input::placeholder{color:var(--color-muted)}
.s-ico{display:grid;place-items:center;color:var(--color-muted)}
.chips-wrap{margin:0 calc(var(--space-md) * -1) var(--space-md);padding:0 var(--space-md)}
.chips{display:flex;gap:var(--space-xs);overflow-x:auto;padding:var(--space-2xs) 0 var(--space-xs);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:var(--space-xs);min-height:44px;padding:0 var(--space-md);
  border:var(--rule-hair) solid var(--color-ink);border-radius:var(--radius-pill);color:var(--color-ink);white-space:nowrap;
  font:500 var(--text-sm)/1 var(--font-body);transition:background var(--dur-short) var(--ease-out),color var(--dur-short) var(--ease-out)}
.chip:hover{background:var(--color-paper-3)}
.chip.on{background:var(--color-ink);color:var(--color-paper)}
.chip-ico{display:grid;place-items:center}
.chip-pill{display:none}

/* ---------- dish cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-md) var(--space-sm);padding-bottom:var(--space-lg)}
.card{position:relative;display:flex;flex-direction:column;background:var(--color-paper-2);
  border:var(--rule-hair) solid color-mix(in oklab,var(--color-ink) 22%,transparent);
  transition:box-shadow var(--dur-short) var(--ease-out),border-color var(--dur-short) var(--ease-out),transform var(--dur-short) var(--ease-out),opacity var(--dur-long) var(--ease-out)}
.card:hover{border-color:var(--color-ink);box-shadow:var(--shadow-card);transform:translate(-3px,-3px)}
.card:active{transform:translate(0,0)}
.js .card.reveal{opacity:0;transform:translateY(12px)}
.js .card.in{opacity:1;transform:none;transition-delay:var(--d,0ms)}
.js .card.in:hover{transform:translate(-3px,-3px)}
.card-emoji{aspect-ratio:1;display:grid;place-items:center;overflow:hidden;background:var(--color-paper-3);color:var(--color-ink-2)}
.card-emoji img{width:100%;height:100%;object-fit:cover;filter:sepia(.2) saturate(.94)}
.card-name{font:var(--display-weight) var(--text-md)/1.2 var(--font-display);padding:var(--space-sm) var(--space-sm) var(--space-2xs);letter-spacing:var(--tracking-display)}
.card-desc{font-size:var(--text-xs);line-height:1.45;color:var(--color-muted);padding:0 var(--space-sm) var(--space-sm);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(1.45em * 2 + var(--space-sm))}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:var(--space-xs);
  padding:var(--space-xs) var(--space-sm) var(--space-sm);border-top:var(--rule-hair) solid var(--color-rule)}
.price{font:var(--display-weight) var(--text-md)/1 var(--font-display);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{position:absolute;top:var(--space-xs);left:var(--space-xs);z-index:2;display:inline-flex;align-items:center;gap:var(--space-2xs);
  padding:var(--space-2xs) var(--space-xs);border-radius:var(--radius-pill);font:600 var(--text-xs)/1 var(--font-label);
  background:var(--color-paper-2);color:var(--color-ink);border:var(--rule-hair) solid var(--color-ink)}
.tag-Hit{background:var(--color-accent);color:var(--color-accent-ink);border-color:var(--color-accent)}
.fav{position:absolute;top:var(--space-2xs);right:var(--space-2xs);z-index:3;width:44px;height:44px;display:grid;place-items:center;
  color:var(--color-paper-2);transition:transform var(--dur-micro) var(--ease-out)}
.fav svg{filter:drop-shadow(0 0 2px color-mix(in oklab,var(--color-ink) 70%,transparent))}
.fav:active{transform:scale(.85)}
.fav.on{color:var(--color-accent)}
.add-btn{width:44px;height:44px;border-radius:var(--radius-pill);display:grid;place-items:center;background:var(--color-accent);color:var(--color-accent-ink);
  transition:background var(--dur-short) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.add-btn:hover{background:var(--color-ink);color:var(--color-paper)}
.add-btn:active{transform:scale(.92)}
.stepper{display:flex;align-items:center;border:var(--rule-hair) solid var(--color-ink);border-radius:var(--radius-pill);padding:var(--space-3xs)}
.stepper button{width:40px;height:40px;border-radius:var(--radius-pill);display:grid;place-items:center;color:var(--color-ink)}
.stepper button:hover{background:var(--color-paper-3)}
.stepper .q{min-width:24px;text-align:center;font:600 var(--text-sm)/1 var(--font-label);font-variant-numeric:tabular-nums}
.sk{aspect-ratio:3/4;background:var(--color-paper-3);animation:skPulse 1.2s var(--ease-in-out) infinite alternate}
@keyframes skPulse{from{opacity:.55}to{opacity:1}}
.empty{grid-column:1/-1;text-align:center;padding:var(--space-2xl) var(--space-md);color:var(--color-muted)}
.empty-ico{display:inline-grid;place-items:center;width:72px;height:72px;border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-pill);margin-bottom:var(--space-sm)}
.empty-title{font:var(--display-weight) var(--text-xl)/1.2 var(--font-display);color:var(--color-ink)}
.empty-sub{font-size:var(--text-sm);margin-top:var(--space-2xs)}

/* ---------- cart bar ---------- */
#cartBar{position:fixed;left:var(--space-sm);right:var(--space-sm);bottom:calc(var(--tab-h) + var(--space-md) + env(safe-area-inset-bottom));z-index:var(--z-sticky);
  display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-md);
  background:var(--color-ink);color:var(--color-paper);outline:var(--rule-hair) solid var(--color-gold);outline-offset:-5px;
  transition:transform var(--dur-long) var(--ease-out),opacity var(--dur-short) var(--ease-out)}
html[data-theme="dark"] #cartBar{background:var(--color-paper-3);color:var(--color-ink)}
.js #cartBar:not(.show){transform:translateY(120%);opacity:0;pointer-events:none}
#cartBar.bounce{animation:cartNudge var(--dur-long) var(--ease-out)}
@keyframes cartNudge{40%{transform:translateY(-4px)}}
.cb-ico{display:grid;place-items:center;width:40px;height:40px}
.cb-text{flex:1;min-width:0}
.cb-count{font:600 var(--text-xs)/1.3 var(--font-label);opacity:.8}
.cb-total{font:var(--display-weight) var(--text-lg)/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.cb-go{min-height:44px;padding:0 var(--space-lg);border-radius:var(--radius-pill);background:var(--color-accent);color:var(--color-accent-ink);font:600 var(--text-sm)/1 var(--font-label)}
.roll{animation:rollIn var(--dur-short) var(--ease-out)}
@keyframes rollIn{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}

/* ---------- tab strip / rail ---------- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sticky-nav);display:flex;align-items:stretch;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding:0 0 env(safe-area-inset-bottom);
  background:var(--color-paper-2);border-top:var(--rule-bar) solid var(--color-ink)}
.sidebar-brand,.sidebar-bottom{display:none}
.tab{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2xs);
  color:var(--color-ink-2);font:600 var(--text-xs)/1 var(--font-label);transition:background var(--dur-short) var(--ease-out),color var(--dur-short) var(--ease-out)}
.tab:hover{background:var(--color-paper-3)}
.tab.on{background:var(--color-ink);color:var(--color-paper)}
.t-ico{display:grid;place-items:center;width:24px;height:24px}
.tab .badge{position:absolute;top:var(--space-xs);right:calc(50% - 28px);min-width:20px;height:20px;padding:0 var(--space-2xs);
  border-radius:var(--radius-pill);background:var(--color-accent);color:var(--color-accent-ink);font:600 var(--text-xs)/1 var(--font-label);
  display:grid;place-items:center;transform:scale(0);transition:transform var(--dur-short) var(--ease-out)}
.tab .badge.show{transform:scale(1)}
.tab-link{color:inherit;text-decoration:none}

/* ---------- sheet (bottom sheet on phone, modal on desktop) ---------- */
#backdrop{position:fixed;inset:0;z-index:var(--z-modal);background:color-mix(in oklab,var(--color-ink) 60%,transparent);opacity:0;pointer-events:none;transition:opacity var(--dur-short) var(--ease-out)}
#backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:calc(var(--z-modal) + 1);width:100%;max-width:520px;transform:translate(-50%,102%);
  background:var(--color-paper-2);border-top:var(--rule-bar) solid var(--color-ink);max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:0 var(--space-md) calc(var(--space-lg) + env(safe-area-inset-bottom));transition:transform var(--dur-long) var(--ease-out)}
.sheet.open{transform:translate(-50%,0)}
.grab{padding:var(--space-sm) 0 var(--space-xs);display:grid;place-items:center;touch-action:none;cursor:grab}
.grab span{width:40px;height:4px;background:var(--color-rule)}
.sheet h2{font-size:var(--text-2xl);margin:var(--space-xs) 0 var(--space-2xs)}
.sheet .muted,.muted{color:var(--color-muted);font-size:var(--text-sm);line-height:1.5;margin:0 0 var(--space-sm)}
.sheet-section-title{font:600 var(--text-sm)/1.3 var(--font-label);color:var(--color-muted);margin:var(--space-lg) 0 var(--space-xs);padding-bottom:var(--space-2xs);border-bottom:var(--rule-hair) solid var(--color-gold)}
.list{background:var(--color-paper-2);border:var(--rule-hair) solid var(--color-rule)}
.list-row{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-md);min-height:56px;border-bottom:var(--rule-hair) solid var(--color-rule)}
.list-row:last-child{border-bottom:0}
.lr-main{flex:1;min-width:0}
.lr-title{font-size:var(--text-md);font-weight:500}
.lr-sub{font-size:var(--text-sm);color:var(--color-muted);margin-top:var(--space-3xs)}
.field{margin-bottom:var(--space-sm)}
.field label{display:block;font:600 var(--text-sm)/1.3 var(--font-label);color:var(--color-ink-2);margin:0 0 var(--space-2xs)}
.input,select.input,textarea.input{width:100%;padding:var(--space-sm) var(--space-md);font-size:var(--text-md);background:var(--color-paper-2);color:var(--color-ink);
  border:var(--rule-hair) solid var(--color-ink);border-radius:0;outline:0;-webkit-appearance:none;appearance:none}
.input:focus{outline:2px solid var(--color-focus);outline-offset:2px}
textarea.input{resize:none;min-height:80px}
.row-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-sm)}
.btn{width:100%;min-height:52px;padding:0 var(--space-lg);border-radius:var(--radius-pill);font:600 var(--text-md)/1 var(--font-label);
  display:flex;align-items:center;justify-content:center;gap:var(--space-xs);position:relative;
  transition:background var(--dur-short) var(--ease-out),color var(--dur-short) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--color-accent);color:var(--color-accent-ink)}
.btn-primary:hover{background:var(--color-ink);color:var(--color-paper)}
.btn-ghost{background:transparent;border:var(--rule-hair) solid var(--color-ink);color:var(--color-ink)}
.btn-ghost:hover{background:var(--color-paper-3)}
.btn-danger{background:transparent;border:var(--rule-hair) solid var(--color-error);color:var(--color-error)}
.btn:disabled{background:var(--color-paper-3);color:var(--color-muted);border:var(--rule-hair) dashed var(--color-rule);cursor:not-allowed}
.btn .spin{width:20px;height:20px;border-radius:50%;border:2px solid color-mix(in oklab,currentColor 30%,transparent);border-top-color:currentColor;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.done{background:var(--color-success);color:var(--color-accent-ink)}
.seg{display:flex;gap:var(--space-3xs);padding:var(--space-3xs);border:var(--rule-hair) solid var(--color-ink);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:40px;padding:0 var(--space-md);font:600 var(--text-sm)/1 var(--font-label);color:var(--color-ink-2);white-space:nowrap;
  transition:background var(--dur-short) var(--ease-out),color var(--dur-short) var(--ease-out)}

function migrateV1(old) {
  const emojiToIcon = {
    '🍚':'bowl','🍛':'bowl','🥘':'bowl','🍲':'bowl','🍽️':'plate',
    '🍢':'skewer','🥩':'skewer','🍗':'skewer','🍖':'skewer',
    '🥟':'dumpling','🫕':'dumpling','🍥':'dumpling',
    '🍜':'noodles','🍝':'noodles','🥣':'noodles',
    '🫓':'bread','🥯':'bread','🥧':'bread',
    '🍵':'cup','🥛':'cup','🧃':'cup','🥤':'cup',
    '🍰':'cake','🥗':'salad'
  };
  const s = seedState();
  if (Array.isArray(old.dishes) && old.dishes.length) {
    s.dishes = old.dishes.map(d => ({
      id: d.id || uid(), name: d.name || 'Taom', desc: d.desc || '', price: d.price || 0,
      cat: d.cat || (s.cats[0] && s.cats[0].id), icon: emojiToIcon[d.emoji] || 'plate',
      tag: d.tag || '', ing: d.ing || '', img: d.img || '', available: d.available !== false
    }));
  }
  if (Array.isArray(old.cats) && old.cats.length) {
    s.cats = old.cats.map(c => ({ id: c.id || uid(), name: c.name || 'Kategoriya', icon: emojiToIcon[c.emoji] || 'plate' }));
  }
  if (Array.isArray(old.orders)) s.orders = old.orders;
  if (old.settings) s.settings = { ...DEF_SETTINGS, ...old.settings };
  return s;
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return {
        dishes: parsed.dishes || seedState().dishes,
        cats: parsed.cats || DEF_CATS.map(c => ({ ...c })),
        orders: parsed.orders || [],
        cart: parsed.cart || {},
        favs: parsed.favs || [],
        settings: { ...DEF_SETTINGS, ...(parsed.settings || {}) }
      };
    }
    const oldRaw = localStorage.getItem(OLD_KEY);
    if (oldRaw) return migrateV1(JSON.parse(oldRaw));
  } catch (e) { console.warn('localStorage xatolik', e); }
  return seedState();
}

const fmt = n => Number(n).toLocaleString('ru-RU').replace(/\u00A0/g, ' ') + ' ' + S.settings.currency;
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[ch]));
function telegramAccountUrl(value = S.settings.telegram) {
  const input = String(value || '').trim();
  if (!input) return '';
  let username = input;
  if (/^https?:\/\//i.test(input)) {
    try {
      const url = new URL(input);
      if (!['t.me', 'www.t.me', 'telegram.me', 'www.telegram.me'].includes(url.hostname.toLowerCase())) return '';
      username = url.pathname.replace(/^\/+|\/+$/g, '');
    } catch (e) { return ''; }
  }
  username = username.replace(/^@/, '');
  return /^[A-Za-z0-9_]{5,32}$/.test(username) ? `https://t.me/${username}` : '';
}
const telephoneHref = value => {
  const compact = String(value || '').replace(/[^\d+]/g, '');
  const number = compact.startsWith('+')
    ? '+' + compact.slice(1).replace(/\+/g, '')
    : compact.replace(/\+/g, '');
  return number ? `tel:${number}` : '';
};

/* ============================================================

   ============================================================ */
const sheetEl = $('#sheet');
const backdrop = $('#backdrop');

function openSheet(html) {
  sheetEl.innerHTML = '<div class="grab" id="grab"><span></span></div>' + html;
  sheetEl.scrollTop = 0;
  sheetEl.classList.add('open');
  backdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
  bindSheetDrag();
  return sheetEl;
}
function closeSheet() {
  sheetEl.classList.remove('open');
  backdrop.classList.remove('show');
  document.body.style.overflow = '';
  sheetEl.style.transform = '';
  setTimeout(() => { if (!sheetEl.classList.contains('open')) sheetEl.innerHTML = ''; }, 460);
}
backdrop.addEventListener('click', closeSheet);

function bindSheetDrag() {
  const grab = $('#grab');
  if (!grab) return;
  let sy = 0, dy = 0, dragging = false;
  grab.addEventListener('pointerdown', e => {
    dragging = true; sy = e.clientY; dy = 0;
    sheetEl.style.transition = 'none';
    try { grab.setPointerCapture(e.pointerId); } catch (err) {}
  });
  grab.addEventListener('pointermove', e => {
    if (!dragging) return;
    dy = Math.max(0, e.clientY - sy);
    sheetEl.style.transform = `translate(-50%, ${dy}px)`;
  });
  const up = () => {
    if (!dragging) return;
    dragging = false;
    sheetEl.style.transition = '';
    sheetEl.style.transform = '';
    if (dy > 95) closeSheet();
  };
  grab.addEventListener('pointerup', up);
  grab.addEventListener('pointercancel', up);
}

                lagmon: 'mic-wave', non: 'mic-pop', ichimlik: 'mic-sway' };

function renderChips() {
  const wrap = $('#chips');
  const cats = [{ id: 'all', name: 'Hammasi', icon: 'plate' }, ...S.cats];
  wrap.innerHTML = cats.map(c =>
    `<button class="chip${activeCat === c.id ? ' on' : ''}" data-cat="${c.id}">
       <span class="chip-ico">${svg(c.icon, 16)}</span><span>${c.name}</span>
     </button>`
  ).join('') + '<div class="chip-pill" id="chipPill"></div>';
  requestAnimationFrame(movePill);
}

function movePill() {
  const on = $('#chips .chip.on');
  const pill = $('#chipPill');
  if (!on || !pill) return;
  pill.style.width = on.offsetWidth + 'px';
  pill.style.transform = `translateX(${on.offsetLeft}px)`;
  try { on.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); } catch (e) {}
}

$('#chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const id = chip.dataset.cat;
  buzz(8);
  const em = chip.querySelector('.chip-ico svg');
  const anim = MICRO[id];
  if (anim && em) { em.classList.remove(anim); void em.offsetWidth; em.classList.add(anim); }
  if (activeCat === id) return;
  activeCat = id;
  $$('#chips .chip').forEach(c => c.classList.toggle('on', c.dataset.cat === id));
  movePill();
  renderGrid();
});

/* ============================================================
   11. DISH GRID
   ============================================================ */
let io = null;

function tagBadge(tag) {
  if (!tag) return '';
  const map = {
    Mashhur: { icon: 'star',     cls: 'tag-Mashhur' },
    Hit:     { icon: 'flame',    cls: 'tag-Hit' },
    Yangi:   { icon: 'sparkles', cls: 'tag-Yangi' }
  };
  const m = map[tag];
  if (!m) return '';
  return `<span class="tag ${m.cls}">${svg(m.icon, 11, 'tag-ic', true)}${tag}</span>`;
}

function cardHTML(d, i) {
  const qty = S.cart[d.id] || 0;
  const fav = S.favs.includes(d.id);
  const visual = `<img src="${escapeHTML(dishImage(d))}" alt="${escapeHTML(d.name)}" loading="lazy">`;

  const foot = qty > 0
    ? `<div class="stepper" data-step="${d.id}">
         <button data-dec="${d.id}" aria-label="Kamaytirish">${svg('minus', 14)}</button>
         <span class="q">${qty}</span>
         <button data-inc="${d.id}" aria-label="Ko'paytirish">${svg('plus', 14)}</button>
       </div>`
    : `<button class="add-btn" data-add="${d.id}" aria-label="Savatga qo'shish">${svg('plus', 18)}</button>`;

  return `
  <article class="card reveal" data-id="${d.id}" style="--d:${Math.min(i, 8) * 40}ms">
    ${tagBadge(d.tag)}
    <button class="fav${fav ? ' on' : ''}" data-fav="${d.id}" aria-label="Sevimlilar">
      ${svg(fav ? 'heartFill' : 'heart', 18)}
    </button>
    <div class="card-emoji">${visual}</div>
    <div class="card-name">${escapeHTML(d.name)}</div>
    <div class="card-desc">${escapeHTML(d.desc)}</div>
    <div class="card-foot">
      <div class="price">${fmt(d.price)}</div>
      ${foot}
    </div>
  </article>`;
}

function dishImage(d) {
  if (d.img) return d.img;
  const photos = {
    plov: 'photo-1512058564366-18510be2db19',
    shashlik: 'photo-1529042410759-befb1204b468',
    manti: 'photo-1563245372-f21724e3856d',
    lagmon: 'photo-1569718212165-3a8278d5f624',
    non: 'photo-1509440159596-0249088772ff',
    ichimlik: 'photo-1544787219-7f47ccb76574'
  };
  const photo = photos[d.cat] || photos.plov;
  return `https://images.unsplash.com/${photo}?auto=format&fit=crop&w=900&q=82`;
}

function renderGrid(skeleton = false) {
  const grid = $('#grid');
  if (skeleton) {
    grid.innerHTML = Array.from({ length: 6 }, () => '<div class="sk"></div>').join('');
    return;
  }
  const q = searchQuery.trim().toLowerCase();
  const list = S.dishes.filter(d => {
    if (!d.available) return false;
    if (activeCat !== 'all' && d.cat !== activeCat) return false;
    if (q && !(d.name.toLowerCase().includes(q) || (d.desc || '').toLowerCase().includes(q))) return false;
    return true;
  });
  const count = $('#menuCount');
  if (count) count.textContent = `${list.length} ta taom`;

  if (!list.length) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-ico">${svg('searchX', 34)}</div>
        <div class="empty-title">Hech narsa topilmadi</div>
        <div class="empty-sub">Boshqa so'z bilan izlab ko'ring</div>
      </div>`;
    return;
  }

  grid.innerHTML = list.map((d, i) => cardHTML(d, i)).join('');
  observeCards();
}

function observeCards() {
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
  $$('#grid .card').forEach(c => io.observe(c));
}

$('#grid').addEventListener('click', e => {
  const favBtn = e.target.closest('[data-fav]');
  if (favBtn) { toggleFav(favBtn.dataset.fav, favBtn); return; }
  const addBtn = e.target.closest('[data-add]');
  if (addBtn) { addToCart(addBtn.dataset.add, addBtn); return; }
  const inc = e.target.closest('[data-inc]');
  if (inc) { addToCart(inc.dataset.inc, inc); return; }
  const dec = e.target.closest('[data-dec]');
  if (dec) { changeQty(dec.dataset.dec, -1); return; }
  const card = e.target.closest('.card');
  if (card) openDishSheet(card.dataset.id);
});

function toggleFav(id, btn) {
  const i = S.favs.indexOf(id);
  if (i >= 0) S.favs.splice(i, 1);
  else S.favs.push(id);
  save();
  buzz(12);
  const on = S.favs.includes(id);
  btn.classList.toggle('on', on);
  btn.innerHTML = svg(on ? 'heartFill' : 'heart', 18);
  if (on) burstParticles(btn);
}

function burstParticles(el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'confetti';
    p.style.background = ['#FF3B30', '#FF6B35', '#FF6B35', '#FF8FA3'][i % 4];
    p.style.left = (r.left + r.width / 2) + 'px';
    p.style.top = (r.top + r.height / 2) + 'px';
    p.style.width = '6px'; p.style.height = '6px'; p.style.borderRadius = '50%';
    p.style.setProperty('--x', (Math.random() * 120 - 60) + 'px');
    p.style.setProperty('--r', '0deg');
    p.style.animationDuration = '.7s';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

/* ============================================================
   12. CART LOGIC
   ============================================================ */
function cartCount() { return Object.values(S.cart).reduce((a, b) => a + b, 0); }
function cartTotal() {
  return Object.entries(S.cart).reduce((sum, [id, q]) => {
    const d = S.dishes.find(x => x.id === id);
    return sum + (d ? d.price * q : 0);
  }, 0);
}

function addToCart(id, fromEl) {
  const d = S.dishes.find(x => x.id === id);
  if (!d) return;
  S.cart[id] = (S.cart[id] || 0) + 1;
  save();
  buzz(10);
  if (fromEl) flyToCart(fromEl, d);
  const card = $(`#grid .card[data-id="${id}"]`);
  if (card) {
    const foot = card.querySelector('.card-foot');
    const qty = S.cart[id];
    foot.innerHTML = `
      <div class="price">${fmt(d.price)}</div>
      <div class="stepper" data-step="${id}">
        <button data-dec="${id}">${svg('minus', 14)}</button>
        <span class="q">${qty}</span>
        <button data-inc="${id}">${svg('plus', 14)}</button>
      </div>`;
  }
  syncCartUI(true);
  if (sheetEl.classList.contains('open') && sheetEl.querySelector('[data-sheet-qty]')) {
    reopenDish(id);
  }
}

function changeQty(id, delta) {
  const cur = S.cart[id] || 0;
  const next = cur + delta;
  if (next <= 0) delete S.cart[id]; else S.cart[id] = next;
  save();
  buzz(8);
  const card = $(`#grid .card[data-id="${id}"]`);
  const d = S.dishes.find(x => x.id === id);
  if (card && d) {
    const foot = card.querySelector('.card-foot');
    if (!S.cart[id]) {
      foot.innerHTML = `<div class="price">${fmt(d.price)}</div>
        <button class="add-btn" data-add="${id}">${svg('plus', 18)}</button>`;
    } else {
      const qEl = foot.querySelector('.q');
      if (qEl) qEl.textContent = S.cart[id];
    }
  }
  syncCartUI(true);
  if (currentView === 'cart') renderCartPage();
  if (sheetEl.classList.contains('open') && sheetEl.querySelector('[data-sheet-qty]')) {
    reopenDish(id);
  }
}

function flyToCart(fromEl, d) {
  const r = fromEl.getBoundingClientRect();
  const bar = $('#cartBar');
  const t = bar.getBoundingClientRect();
  const targetX = t.left + 30;
  const targetY = t.top + t.height / 2;

  const el = document.createElement('div');
  el.className = 'flyer';
  el.innerHTML = `<img src="${escapeHTML(dishImage(d))}" alt="">`;
  el.style.left = (r.left + r.width / 2 - 20) + 'px';
  el.style.top = (r.top + r.height / 2 - 20) + 'px';
  document.body.appendChild(el);
  requestAnimationFrame(() => {
    el.style.transform =
      `translate(${targetX - (r.left + r.width / 2 - 20)}px, ${targetY - (r.top + r.height / 2 - 20)}px) scale(.28)`;
    el.style.opacity = '0.15';
  });
  setTimeout(() => el.remove(), 720);
}

function syncCartUI(animate) {
  const count = cartCount();
  const total = cartTotal();
  const cbCount = $('#cbCount');
  const cbTotal = $('#cbTotal');
  const badge = $('#tabBadge');

  if (animate) {
    [cbCount, cbTotal].forEach(el => { el.classList.remove('roll'); void el.offsetWidth; el.classList.add('roll'); });
  }
  cbCount.textContent = count;
  cbTotal.textContent = fmt(total);
  badge.textContent = count;
  badge.classList.toggle('show', count > 0);

  const bar = $('#cartBar');
  bar.classList.toggle('show', count > 0 && currentView === 'menu');
  if (animate) { bar.classList.remove('bounce'); void bar.offsetWidth; bar.classList.add('bounce'); }
}

$('#cbGo').addEventListener('click', () => setView('cart'));
$('#cartBar').addEventListener('click', e => {
  if (e.target.closest('#cbGo')) return;
  setView('cart');
});

   13. DISH DETAIL SHEET
   ============================================================ */
function openDishSheet(id) {
  const d = S.dishes.find(x => x.id === id);
  if (!d) return;
  const qty = S.cart[id] || 0;
  const visual = `<img src="${escapeHTML(dishImage(d))}" alt="${escapeHTML(d.name)}">`;

  const qtyBlock = qty > 0
    ? `<div class="stepper" data-sheet-qty="${id}" style="transform:scale(1.15)">
         <button data-sdec="${id}">${svg('minus', 14)}</button><span class="q">${qty}</span><button data-sinc="${id}">${svg('plus', 14)}</button>
       </div>`
    : `<button class="add-btn" style="width:44px;height:44px" data-sadd="${id}">${svg('plus', 20)}</button>`;

  openSheet(`
    <div class="card-emoji" style="height:clamp(200px, 35vh, 300px);margin:0 0 16px;border-radius:20px">${visual}</div>
    <h2>${d.name}</h2>
    <p class="muted">${d.desc}</p>
    ${d.ing ? `<div class="sheet-section-title">Tarkibi</div><p class="muted">${d.ing}</p>` : ''}
    <div class="sheet-section-title">Narxi</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px">
      <div style="font-size:22px;font-weight:800;letter-spacing:-.5px">${fmt(d.price)}</div>
      ${qtyBlock}
    </div>
    <button class="btn btn-primary" id="sheetAddBtn">Savatga qo'shish</button>
    <div style="height:8px"></div>
  `);

  const card = $(`#grid .card[data-id="${id}"]`);
  if (card) { card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 800); }

  const handler = e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.id === 'sheetAddBtn') { addToCart(id, null); closeSheet(); toast("Savatga qo'shildi"); }
    else if (t.dataset.sadd || t.dataset.sinc) { addToCart(id, null); }
    else if (t.dataset.sdec) { changeQty(id, -1); }
  };
  if (sheetEl._dishHandler) sheetEl.removeEventListener('click', sheetEl._dishHandler);
  sheetEl.addEventListener('click', handler);
  sheetEl._dishHandler = handler;
}

function reopenDish(id) {
  const d = S.dishes.find(x => x.id === id);
  const qty = S.cart[id] || 0;
  const holder = sheetEl.querySelector('[data-sheet-qty], [data-sadd]');
  if (!holder || !d) return;
  holder.outerHTML = qty > 0
    ? `<div class="stepper" data-sheet-qty="${id}" style="transform:scale(1.15)">
         <button data-sdec="${id}">${svg('minus', 14)}</button><span class="q">${qty}</span><button data-sinc="${id}">${svg('plus', 14)}</button>
       </div>`
    : `<button class="add-btn" style="width:44px;height:44px" data-sadd="${id}">${svg('plus', 20)}</button>`;
}

        <button class="btn btn-primary" id="goMenuBtn">Menyuga o'tish</button>
      </div>`;
    $('#goMenuBtn').addEventListener('click', () => setView('menu'));
    return;
  }

  const rows = entries.map(([id, qty]) => {
    const d = S.dishes.find(x => x.id === id);
    const visual = d.img ? `<img src="${d.img}" alt="">` : svg(d.icon || 'plate', 22);
    return `
      <div class="swipe-wrap" style="margin-bottom:10px">

          <div class="adm-row">
            <div class="adm-emoji">${visual}</div>
            <div class="adm-main">
              <div class="adm-name">${d.name}</div>
              <div class="adm-sub">${fmt(d.price)} × ${qty} = <b>${fmt(d.price * qty)}</b></div>
            </div>
            <div class="stepper">
              <button data-cdec="${id}">${svg('minus', 14)}</button><span class="q">${qty}</span><button data-cinc="${id}">${svg('plus', 14)}</button>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');

  view.innerHTML = `
    <div style="padding:4px 0 10px">
      <div class="sheet-section-title" style="margin-top:0">Buyurtmangiz</div>
      ${rows}
    </div>
    <div class="list" style="margin-bottom:14px">
      <div class="list-row" style="justify-content:space-between">
        <span style="font-size:14.5px;font-weight:600">Mahsulotlar (${cartCount()})</span>
        <b style="font-size:15px">${fmt(cartTotal())}</b>
      </div>
      <div class="list-row" style="justify-content:space-between">
        <span style="font-size:14.5px;font-weight:600">Yetkazib berish</span>
        <span style="font-size:13.5px;color:var(--green);font-weight:700">Bepul</span>
      </div>
      <div class="list-row" style="justify-content:space-between">
        <span style="font-size:15px;font-weight:800">Jami</span>
        <b style="font-size:19px;letter-spacing:-.5px">${fmt(cartTotal())}</b>
      </div>
    </div>
    <div class="sheet-section-title">Ma'lumotlaringiz</div>
    <div class="field"><label>Ismingiz</label><input class="input" id="ordName" placeholder="Ism Familiya" value="${S._lastName || ''}"></div>
    <div class="field"><label>Telefon</label><input class="input" id="ordPhone" type="tel" inputmode="tel" placeholder="+998 90 000 00 00" value="${S._lastPhone || ''}"></div>
    <div class="field"><label>Manzil</label><input class="input" id="ordAddress" placeholder="Ko'cha, uy, xonadon" value="${S._lastAddr || ''}"></div>
    <div class="field"><label>Izoh (ixtiyoriy)</label><textarea class="input" id="ordNote" placeholder="Masalan: achchiq bo'lmasin"></textarea></div>
    <button class="btn btn-primary" id="placeOrderBtn" style="margin-top:6px">Buyurtma berish · ${fmt(cartTotal())}</button>

  $$('#view-cart .swipe-row').forEach(row => {

function makeSwipeable(el, onDelete) {
  let sx = 0, sy = 0, dx = 0, dragging = false, decided = false;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button,input,.switch,.drag-handle')) return;
    sx = e.clientX; sy = e.clientY; dx = 0;
    dragging = true; decided = false;
    el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decided = true;
      if (Math.abs(my) > Math.abs(mx)) { dragging = false; el.style.transition = ''; return; }
    }
    dx = Math.min(0, mx);
    el.style.transform = `translateX(${dx}px)`;
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    el.style.transition = 'transform .3s var(--ease), opacity .3s';
    if (dx < -80) {
      el.style.transform = 'translateX(-110%)';
      el.style.opacity = '0';
      buzz(14);
      setTimeout(onDelete, 220);
    } else el.style.transform = 'translateX(0)';
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

function bindDragReorder(handle, container) {
  let row = null, startY = 0, active = false;
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    row = handle.closest('.swipe-wrap');
    if (!row) return;
    active = true; startY = e.clientY;
    row.classList.add('dragging');
    row.style.transition = 'none';
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
  });
  handle.addEventListener('pointermove', e => {
    if (!active || !row) return;
    const dy = e.clientY - startY;
    row.style.transform = `translateY(${dy}px)`;
    const rect = row.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    const siblings = Array.from(container.children).filter(c => c !== row);
    for (const s of siblings) {
      const r = s.getBoundingClientRect();
      const sMid = r.top + r.height / 2;
      if (mid > r.top && mid < r.bottom) {
        if (mid > sMid && row.nextElementSibling !== s) container.insertBefore(row, s.nextSibling);
        else if (mid < sMid && row.previousElementSibling !== s) container.insertBefore(row, s);
        break;
      }
    }
  });
  const end = () => {
    if (!active) return;
    active = false;
    if (!row) return;
    row.classList.remove('dragging');
    row.style.transition = '';
    row.style.transform = '';
    const ids = Array.from(container.children).map(c => c.dataset.dishwrap);
    S.dishes.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
    save(); renderGrid(); row = null;
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
}

    <h2>${c ? 'Kategoriyani tahrirlash' : 'Yangi kategoriya'}</h2>
    <div class="field"><label>Nomi</label>
      <input class="input" id="cName" placeholder="Masalan: Shirinliklar" value="${c ? c.name : ''}"></div>
    <div class="field"><label>Ikonka</label>
      <div class="icon-picker" id="cIconPicker">${iconPicker}</div></div>
    <button class="btn btn-primary" id="saveCat">Saqlash</button>
    <div style="height:8px"></div>
  `);

  $$('#cIconPicker .icon-pick').forEach(b => {
    b.addEventListener('click', () => {
      $$('#cIconPicker .icon-pick').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      buzz(6);
    });
  });

  $('#saveCat').addEventListener('click', () => {
    const name = $('#cName').value.trim();
    const icon = ($('#cIconPicker .icon-pick.on') || {}).dataset?.icon || 'plate';
    if (!name) { toast('Nomini kiriting'); return; }
    if (c) { c.name = name; c.icon = icon; }
    else S.cats.push({ id: uid(), name, icon });
    save();
    closeSheet();
    toast('Saqlandi');
    renderAdminCats(); renderChips();
  });
}

/* ---------- ADMIN: ORDERS ---------- */
const STATUSES = [
  { key: 'new',     label: 'Yangi',           cls: 'st-new' },
  { key: 'cook',    label: 'Tayyorlanmoqda',  cls: 'st-cook' },
  { key: 'deliver', label: 'Yetkazilmoqda',   cls: 'st-deliver' },
  { key: 'done',    label: 'Bajarildi',       cls: 'st-done' }
];

function renderAdminOrders() {
  const body = $('#adminBody');
  if (!S.orders.length) {
    body.innerHTML = `
      <div style="padding:50px 20px;text-align:center">
        <div class="empty-ico" style="animation:none">${svg('receipt', 34)}</div>
        <div style="font-size:16px;font-weight:700;margin-top:6px">Hozircha buyurtmalar yo'q</div>
        <div style="font-size:13px;color:var(--text-2);margin-top:6px">Yangi buyurtmalar shu yerda ko'rinadi</div>
      </div>`;
    return;
  }

  body.innerHTML = S.orders.map(o => {
    const st = STATUSES.find(s => s.key === o.status) || STATUSES[0];
    return `
      <div class="order-card">
        <div class="order-head">
          <div class="order-id">${o.id} · ${o.name}</div>
          <div class="order-time">${new Date(o.time).toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
        </div>
        <div class="order-items">${o.items.map(i => `${i.name} × ${i.qty}`).join(' · ')}</div>
        <div class="order-items" style="font-size:12px">
          <span class="order-meta">${svg('phone', 12)}${o.phone}</span>
          <span class="order-meta">${svg('location', 12)}${o.address}</span>
          ${o.note ? `<br><span class="order-meta">${svg('note', 12)}${o.note}</span>` : ''}
        </div>
        <div class="order-foot" style="margin-bottom:8px">
          <span class="order-total">${fmt(o.total)}</span>
          <span style="font-size:12px;font-weight:700">
            <span class="status-dot ${st.cls}"></span>${st.label}
          </span>
        </div>
        <div class="seg">
          ${STATUSES.map(s => `<button data-ostatus="${o.id}" data-s="${s.key}" class="${o.status === s.key ? 'on' : ''}">${s.label}</button>`).join('')}
        </div>
      </div>`;
  }).join('');

  body.querySelectorAll('[data-ostatus]').forEach(b => {
    b.addEventListener('click', () => {
      const o = S.orders.find(x => x.id === b.dataset.ostatus);
      if (!o) return;
      o.status = b.dataset.s;
      save(); buzz(10);
      renderAdminOrders();
    });
  });
}

/* ---------- ADMIN: SETTINGS ---------- */
function renderAdminSettings() {
  const st = S.settings;
  const body = $('#adminBody');
  body.innerHTML = `
    <div class="sheet-section-title" style="margin-top:0">Restoran</div>
    <div class="field"><label>Nomi</label><input class="input" id="sName" value="${escapeHTML(st.name)}"></div>
    <div class="field"><label>Telefon</label><input class="input" id="sPhone" value="${escapeHTML(st.phone)}"></div>
    <div class="field"><label>Telegram akkaunt havolasi yoki username</label>
      <input class="input" id="sTg" placeholder="https://t.me/username yoki @username" value="${escapeHTML(st.telegram)}"></div>
    <p class="muted">Mijozlar shu akkauntga Telegram orqali yozishi mumkin.</p>
    <div class="field"><label>Ish vaqti</label><input class="input" id="sHours" value="${escapeHTML(st.hours)}"></div>
    <div class="field"><label>Valyuta</label><input class="input" id="sCur" value="${escapeHTML(st.currency)}"></div>

    <div class="sheet-section-title">Xavfsizlik</div>
    <div class="field"><label>Admin PIN (4 xonali)</label>
      <input class="input" id="sPin" inputmode="numeric" maxlength="4" value="${st.pin}"></div>

    <button class="btn btn-primary" id="saveSettings" style="margin-bottom:16px">Saqlash</button>

    <div class="sheet-section-title">Ma'lumotlar</div>
    <div class="list" style="margin-bottom:14px">
      <div class="settings-row" id="exportRow" style="cursor:pointer">
        <div class="sr-left"><span class="sr-ico">${svg('download', 18)}</span><span>JSON eksport</span></div>
        ${svg('chevronRight', 16)}
      </div>
      <div class="settings-row" id="importRow" style="cursor:pointer">
        <div class="sr-left"><span class="sr-ico">${svg('upload', 18)}</span><span>JSON import</span></div>
        ${svg('chevronRight', 16)}
      </div>
      <div class="settings-row" id="resetRow" style="cursor:pointer">
        <div class="sr-left"><span class="sr-ico" style="color:var(--red)">${svg('rotate', 18)}</span><span style="color:var(--red)">Hammasini tiklash</span></div>
        ${svg('chevronRight', 16)}
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <div style="font-size:12px;color:var(--text-3);text-align:center;padding-bottom:10px">
      Osh Markazi · v2.0 · ${S.dishes.length} taom
    </div>
  `;

  $('#saveSettings').addEventListener('click', () => {
    const pin = $('#sPin').value.trim();
    if (!/^\d{4}$/.test(pin)) { toast("PIN 4 xonali raqam bo'lishi kerak"); return; }
    const telegramInput = $('#sTg').value.trim();
    const telegram = telegramAccountUrl(telegramInput);
    if (telegramInput && !telegram) {
      toast("Telegram uchun @username yoki t.me/username kiriting");
      $('#sTg').focus();
      return;
    }
    S.settings = {
      name: $('#sName').value.trim() || 'Osh Markazi',
      phone: $('#sPhone').value.trim(),
      telegram,
      hours: $('#sHours').value.trim(),
      currency: $('#sCur').value.trim() || "so'm",
      pin
    };
    save();
    $('#largeTitle').textContent = S.settings.name;
    syncSidebarDetails();
    renderGrid(); syncCartUI(false);
    if (currentView === 'orders') renderOrdersPage();
    toast('Sozlamalar saqlandi');
  });

  $('#exportRow').addEventListener('click', () => {
    const data = JSON.stringify(S, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'osh-markazi-backup.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Eksport qilindi');
  });

  $('#importRow').addEventListener('click', () => $('#importFile').click());

  $('#importFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.dishes || !parsed.cats) throw new Error('bad');
        S = {
          dishes: parsed.dishes,
          cats: parsed.cats,
          orders: parsed.orders || [],
          cart: parsed.cart || {},
          favs: parsed.favs || [],
          settings: { ...DEF_SETTINGS, ...(parsed.settings || {}) }
        };
        save();
        syncSidebarDetails();
        toast('Import muvaffaqiyatli');
        renderChips(); renderGrid(); syncCartUI(false); renderAdmin();
      } catch (err) { toast("Fayl noto'g'ri formatda"); }
    };
    r.readAsText(f);
  });

  $('#resetRow').addEventListener('click', () => {
    openSheet(`
      <h2>Hammasini tiklash?</h2>
      <p class="muted">Barcha taomlar, buyurtmalar va sozlamalar o'chiriladi va standart holatga qaytadi. Bu amalni bekor qilib bo'lmaydi.</p>
      <button class="btn btn-danger" id="confirmReset">Ha, tiklash</button>
      <div style="height:8px"></div>
      <button class="btn btn-ghost" id="cancelReset">Bekor qilish</button>
      <div style="height:8px"></div>
    `);
    $('#cancelReset').addEventListener('click', closeSheet);
    $('#confirmReset').addEventListener('click', () => {
      S = seedState(); save(); closeSheet();
      syncSidebarDetails();
      toast('Hammasi tiklandi');
      renderChips(); renderGrid(); syncCartUI(false);
      adminSection = 'dishes'; renderAdmin();
    });
  });
}

/* ============================================================
   19. HEADER SCROLL + PARALLAX + PULL-TO-REFRESH
   ============================================================ */
const headerEl = $('#header');
window.addEventListener('scroll', () => {
  headerEl.classList.toggle('scrolled', window.scrollY > 12);
}, { passive: true });

(function pullToRefresh() {
  let startY = 0, pulling = false, dist = 0;
  const ptr = $('#ptr');
  ptr.innerHTML = svg('refresh', 22);

  document.addEventListener('touchstart', e => {
    if (window.scrollY <= 0 && currentView === 'menu') {
      startY = e.touches[0].clientY; pulling = true;
    }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    dist = e.touches[0].clientY - startY;
    if (dist > 0) {
      const d = Math.min(dist * 0.45, 80);
      ptr.style.transform = `translateX(-50%) translateY(${d}px) scale(${Math.min(1, d / 50)})`;
      ptr.style.opacity = Math.min(1, d / 50);
    }
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!pulling) return;
    if (dist > 90) {
      ptr.innerHTML = svg('check', 22);
      setTimeout(() => {
        renderGrid();
        toast('Menyu yangilandi');
        ptr.innerHTML = svg('refresh', 22);
      }, 400);
    }
    pulling = false; dist = 0;
    ptr.style.transform = 'translateX(-50%) scale(.5)';
    ptr.style.opacity = '0';
  }, { passive: true });
})();

/* ============================================================
   20. BOOT
   ============================================================ */
function bootApp() {
  initStaticIcons();

  const heroTitle = $('#heroTitle');
  heroTitle.innerHTML =
    `Milliy ta’m bir joyda!`;

  renderChips();
  renderGrid(true);

  setTimeout(() => {
    renderGrid();
    syncCartUI(false);
  }, 750);

  setTimeout(() => toast('Xush kelibsiz!'), 1400);
}
